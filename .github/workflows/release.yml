name: Release

# A vX.Y.Z tag publishes ghcr.io/<this repo>:vX.Y.Z and :latest (linux/amd64), after the whole
# CI workflow passes on the tagged commit. A pre-release tag (with a hyphen, v0.2.0-rc1)
# publishes only its own tag. In a fork the same file publishes the fork's own image, with its
# apps, under the fork's org. Why there is no arm64 image yet: docs/agents/deploy.md §9.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # :latest is what deploy/compose.yml runs by default, so only a release moves it.
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # registry names must be lowercase
          tags=("$image:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) echo "Pre-release tag: :latest stays where it is" ;;
            *) tags+=("$image:latest") ;;
          esac
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            "${tags[@]/#/--tag=}" .
          for tag in "${tags[@]}"; do docker push "$tag"; done
