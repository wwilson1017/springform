name: CI

# One workflow for upstream and every fork: a fork's .github/ stays byte-identical to upstream.
# Required checks: Backend, Frontend, Secret scan, Fork scope (a no-op upstream).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Import check (no database)
        run: DATA_DIR="$(mktemp -d)" uv run python -c "from backend.main import create_app; create_app()"

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: frontend
        run: npm test

      - name: Build (vite)
        working-directory: frontend
        run: npm run build

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true

      - name: Generated API types are current
        run: |
          uv sync --frozen
          scripts/gen-types.sh
          # -N so a types file that was never committed shows up in the diff too.
          git add -N frontend/src/core/api/types.gen.ts
          git diff --exit-code -- frontend/src/core/api/types.gen.ts \
            || { echo "::error::types.gen.ts is stale: run scripts/gen-types.sh and commit it"; exit 1; }

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The pinned binary, verified by SHA-256, instead of the marketplace action: no license
      # gate, no GitHub API permissions, just pass/fail. --log-opts=HEAD scans this branch's
      # whole history but not other branches' (gitleaks' git mode defaults to --all).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --verbose --log-opts="HEAD"

  image:
    name: Image test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t springform:ci .

      # A fresh, runner-owned directory as /data proves the entrypoint's chown and the drop
      # to the app user; the health check proves the image's SQLite from the live connection.
      - name: Boot and check health
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          docker run -d --name springform -p 8000:8000 -v "$data:/data" springform:ci
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:8000/up && break; sleep 1; done
          curl -fsS http://localhost:8000/up
          curl -fsS http://localhost:8000/api/health | python3 -c '
          import json, sys
          health = json.load(sys.stdin)
          print(health)
          assert tuple(map(int, health["sqlite_version"].split("."))) >= (3, 51, 3), "SQLite < 3.51.3"
          assert health["fts5"] is True, "FTS5 missing"'
          sudo test -s "$data/setup-token"

      - name: Container log
        if: always()
        run: docker logs springform || true

  fork-scope:
    name: Fork scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Self-test the scope check
        run: scripts/test-fork-scope.sh

      # Upstream has no FORK.md, so this passes there. In a fork it fetches the pinned upstream
      # tag and fails if any core path differs from it.
      - name: Core equals the pinned upstream tag
        run: scripts/check-fork-scope.sh
