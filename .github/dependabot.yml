# Minor and patch updates arrive grouped weekly and ship automatically when green.
# Major updates arrive alone.
# The cooldown skips releases younger than 3 days.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
