name: A password Whisk remembers is saved blanked, and the model is told what was removed
steps:
  - send: Remember that the till password is on the office board.
    replies:
      - {tool: core_memory_remember, args: {text: "The till password: Till2026!, written on the office board."}}
      - Saving that fact needs your approval.
    events:
      - {type: confirm, tool: core_memory_remember}
      - done
  - approve: core_memory_remember
    status: done
  - continue: true
    replies: ["Saved, without the password itself."]
    events:
      - {type: text, text: "Saved, without the password itself."}
      - done
    request:
      messages_contain:
        - 'The till password: [removed: password], written on the office board.'
        - '"removed": [{"kind": "password", "count": 1}]'
        - '"size": "'
      messages_exclude:
        - '"text": "The till password: Till2026!'
