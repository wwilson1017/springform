name: A topic reminder shows on the next message that mentions it, once; the resume after an approval and the cooldown hold it back
tools:
  - name: core_scen_save_widget
    writes: true
    returns: {saved: widget-77}
steps:
  - send: Save the blue widget, and when the walk-in freezer comes up, remind me to book the service visit.
    replies:
      - - {tool: core_remind_on_topic, args: {terms: [walk-in freezer], note: Book the freezer service visit}}
        - {tool: core_scen_save_widget, args: {color: blue}}
      - Saved the reminder; saving the widget needs your approval.
    events:
      - {type: tool_end, tool: core_remind_on_topic, status: done}  # routine: no Approve card
      - {type: confirm, tool: core_scen_save_widget}
      - done
    request:
      system_exclude: [Book the freezer service visit]  # the message that set it does not fire it
  - approve: core_scen_save_widget
    status: done
  - continue: true  # the resume carries no typed text, so the message that set it still does not fire it
    replies: [Saved widget-77.]
    events: [done]
    request:
      system_exclude: [Book the freezer service visit]
  - send: The walk-in freezers are making noise again.
    replies: [That sounds worth a look. You also wanted to book the service visit.]
    events: [done]
    request:
      system_contains: ["## Topic reminder", '<topic_reminder id="', "When walk-in freezer comes up: Book the freezer service visit"]
  - send: Still the walk-in freezer.
    replies: [Noted.]
    events: [done]
    request:
      system_exclude: [Book the freezer service visit, "## Topic reminder"]  # within the 24-hour cooldown
  - send: The walk-in freezer again.
    sql: "UPDATE core_agent_intents SET last_fired_at = '2000-01-01T00:00:00Z'"  # a day has passed
    replies: [Noted.]
    events: [done]
    request:
      system_contains: [Book the freezer service visit]
