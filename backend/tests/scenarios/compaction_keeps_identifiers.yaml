name: Compaction keeps the record id, the amount and the latest ask verbatim in the fenced gist that replaces the aged rows
context_window: 1000  # tiny, so the fourth turn compacts
steps:
  - send: Hello.
    replies: [Hi.]
  - send: Deal 4521 is worth 1250.00 and closes 2026-12-01.
    replies: [Noted deal 4521.]
  - send: Invoice INV-0042 belongs to it.
    replies: [Noted INV-0042.]
  - send: What do we know about the deal?
    replies:
      - "## Pending user asks\nInvoice INV-0042 belongs to it. (answered)\n## Exact identifiers\nDeal 4521, 1250.00, 2026-12-01"  # the summary
      - Deal 4521 closes 2026-12-01.
    events: [compacted, {type: text, text: Deal 4521 closes 2026-12-01.}, done]
    request:
      - call: 0  # the summarizer (light tier), told what must survive; no memory flush while the nightly pass is off
        system_contains: [Exact identifiers, MUST APPEAR VERBATIM]
        messages_contain: ["- 4521\n- 1250.00\n- 2026-12-01", "- Invoice INV-0042 belongs to it.", Noted INV-0042.]
      - call: 1  # the turn, after compaction
        messages_contain: ['<conversation_summary id="', "Deal 4521, 1250.00, 2026-12-01", Hello., "What do we know about the deal?"]
        messages_exclude: [Noted INV-0042.]
