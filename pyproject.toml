[project]
name = "springform"
version = "0.1.0"
description = "An open-source foundation for small-business software: one SQLite file, one process, apps in folders."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "bcrypt>=4.2",
    "beautifulsoup4>=4.15.0",
    "cryptography>=43",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "google-auth>=2.62.2",
    "httpx>=0.27",
    "mcp==2.3.0",
    "openai>=3.57.0",
    "openpyxl>=3.1.5",
    "packaging>=24",
    "pillow>=11",
    "py-vapid>=1.9.4",
    "pydantic>=2.14.4",
    "pyjwt>=2.9",
    "pyotp>=2.12.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pywebpush>=2.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    # SQLite with FTS5 for dev/CI. Linux x86_64 wheels only; elsewhere the stdlib sqlite3 is used.
    "pysqlite3-binary>=0.5.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pyright==1.1.414",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",  # the Whisk scenario files (backend/tests/scenarios)
    "ruff>=0.17.6",
    "pyrage>=1.4.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["backend", "scripts", "run.py", "conftest.py"]
exclude = ["backend/static", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
# Tests subscript and call rows and specs they have just made: a None there already fails the test
# with a TypeError, so the Optional-access rules (about 270 hits) are off for test code only.
# simplification: roots take no globs, so each app's tests folder is listed; add one when an app's tests need it.
executionEnvironments = [
    { root = "backend/tests", extraPaths = ["."], reportOptionalSubscript = "none", reportOptionalMemberAccess = "none", reportOptionalCall = "none" },
    { root = "backend/apps/example/tests", extraPaths = ["."], reportOptionalSubscript = "none", reportOptionalMemberAccess = "none", reportOptionalCall = "none" },
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "backend/apps"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "data", "node_modules", "frontend"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
combine-as-imports = true
