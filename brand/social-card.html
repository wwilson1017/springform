<!doctype html>
<!-- Source of site/social-card.png (the og:image for myspringform.com). Kept out of site/ so it is not published.

<html lang="en">
<head>
<meta charset="utf-8">
<title>Springform social card</title>
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f1f1e8; color: #292929;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .card { box-sizing: border-box; height: 100%; padding: 76px 88px 72px; display: flex; flex-direction: column; }
  .lockup { display: flex; align-items: center; gap: 0.4em; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; }
  .lockup svg { width: 1.25em; height: 1.25em; display: block; }
  .card { position: relative; }
  .big { position: absolute; right: 88px; top: 50%; width: 300px; height: 300px; transform: translateY(-50%); }
  h1 { margin: auto 0 0; font-size: 72px; line-height: 1.06; letter-spacing: -0.025em; font-weight: 800; max-width: 700px; }
  .foot { display: flex; align-items: center; gap: 16px; margin-top: 40px; font-size: 26px; font-weight: 600; color: #9a4322; }
  .foot::before { content: ""; width: 44px; height: 3px; background: #b5542d; }
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="50" width="16" height="10" rx="2" fill="#292929"/><rect x="24" y="50" width="16" height="10" rx="2" fill="#292929"/><rect x="44" y="50" width="16" height="10" rx="2" fill="#292929"/><rect x="24" y="36" width="16" height="10" rx="2" fill="#292929"/><rect x="44" y="36" width="16" height="10" rx="2" fill="#b5542d" fill-opacity="0.3"/><polyline points="45.5,34.5 58.5,30 45.5,25.5 56.5,21" fill="none" stroke="#b5542d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="13" r="7.2" fill="#b5542d"/></svg>
    <span>springform</span>
  </div>
  <svg class="big" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="50" width="16" height="10" rx="2" fill="#292929"/><rect x="24" y="50" width="16" height="10" rx="2" fill="#292929"/><rect x="44" y="50" width="16" height="10" rx="2" fill="#292929"/><rect x="24" y="36" width="16" height="10" rx="2" fill="#292929"/><rect x="44" y="36" width="16" height="10" rx="2" fill="#b5542d" fill-opacity="0.3"/><polyline points="45.5,34.5 58.5,30 45.5,25.5 56.5,21" fill="none" stroke="#b5542d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="13" r="7.2" fill="#b5542d"/></svg>
  <h1>Small-business software, minus the plumbing.</h1>
  <div class="foot">Open source · MIT · myspringform.com</div>
</div>
</body>
</html>
